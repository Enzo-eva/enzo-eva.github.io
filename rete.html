<!doctype html>
<html lang="it"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Rete</title>
<link rel="icon" type="image/png" sizes="192x192" href="rete-icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="https://link.skinem.it/rete-icon-180.png?v=3">
<meta name="apple-mobile-web-app-title" content="Rete">
<meta name="theme-color" content="#00B3E6">
<style>
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:#00B3E6;color:#fff;font-family:"Avenir Next","Segoe UI",system-ui,sans-serif;padding:24px;text-align:center}
img{width:150px;height:150px;border-radius:34px;box-shadow:0 10px 30px rgba(0,0,0,.15)}
a{display:inline-block;background:#fff;color:#0083ad;text-decoration:none;font-weight:600;padding:16px 28px;border-radius:14px;font-size:18px}
p{margin:0;max-width:32ch;opacity:.95}
</style>
</head><body>
<img src="rete-icon-512.png" alt="Rete">
<a id="go" href="#" hidden>Apri Rete</a>
<p id="msg">Apri Rete dal tuo link personale.</p>
<script>
// La chiave sta solo nel link personale di Enzo (dopo il #), mai in questa pagina.
var EXEC='https://script.google.com/macros/s/AKfycbx-NwvFmw1Zpw6Yhb0gI-E4CAS0TXbhxy8TUDbiXS8YqKmw3hx3F5Lxdox-ijO40p1J/exec';
var m=location.hash.match(/k=([A-Za-z0-9]+)/);
if(m){
  var url=EXEC+'?k='+m[1];
  var go=document.getElementById('go');go.href=url;go.hidden=false;
  if(/[?&]setup/.test(location.search)){
    document.getElementById('msg').textContent="Per l'icona: Condividi → Aggiungi alla schermata Home. Poi apri Rete dall'icona.";
  }else{
    document.getElementById('msg').textContent='';
    location.replace(url);
  }
}
</script>
</body></html>
