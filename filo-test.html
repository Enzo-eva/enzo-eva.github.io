:root{
  --bg:#ffffff;--fg:#3a3a39;--muted:#7a7c7d;--brand:#00B3E6;--brand-ink:#0089b0;--grey:#575756;
  --line:#e2e8ec;--chip:#f3f8fb;--sel:#e3f6fc;--banana:#FFE14D;--ink:#2A2B2C;
  --font:"Larke Neue","Avenir Next","Century Gothic","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1417;--fg:#e8eef1;--muted:#98a4aa;--brand:#19bdec;--brand-ink:#5fd3f5;--grey:#c9cfd2;--line:#253038;--chip:#172025;--sel:#0f3341;--ink:#e8eef1;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1417;--fg:#e8eef1;--muted:#98a4aa;--brand:#19bdec;--brand-ink:#5fd3f5;--grey:#c9cfd2;--line:#253038;--chip:#172025;--sel:#0f3341;--ink:#e8eef1;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
.app{max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.bar{display:flex;gap:5px;padding:14px 20px 0;padding-top:max(14px,env(safe-area-inset-top))}
.bar i{flex:1;height:3px;border-radius:3px;background:var(--line);transition:background .3s}
.bar i.on{background:var(--brand)}
.page{display:none;flex:1;flex-direction:column;padding:28px 24px 24px;padding-bottom:max(24px,env(safe-area-inset-bottom));animation:in .35s ease}
.page.on{display:flex}
@keyframes in{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.page{animation:none}}
.logo{color:var(--grey);height:30px;width:auto;display:block}
.logo.sm{height:20px;margin:0 auto}
.k{margin:0;font-size:12px;font-weight:500;letter-spacing:.24em;text-transform:uppercase;color:var(--brand-ink)}
h1,h2{font-weight:300;color:var(--grey);margin:8px 0 0;line-height:1.15;text-wrap:balance}
h1{font-size:34px}h2{font-size:26px}
h1 b,h2 b{font-weight:500;color:var(--fg)}
.lead{margin:14px 0 0;color:var(--muted);font-size:16px;max-width:36ch}
.sp{flex:1;min-height:20px}
.filo{position:relative;height:120px;margin:34px 0 8px}
.filo svg{width:100%;height:100%;overflow:visible}
.filo path{fill:none;stroke:var(--brand);stroke-width:2;stroke-linecap:round;stroke-dasharray:6 7;animation:dash 1.6s linear infinite}
@keyframes dash{to{stroke-dashoffset:-26}}
@media (prefers-reduced-motion:reduce){.filo path{animation:none}}
.filo .p{fill:var(--chip);stroke:var(--line);stroke-width:1.5}
.filo .c{fill:var(--banana);stroke:var(--ink);stroke-width:1.5}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:54px;width:100%;border-radius:16px;border:1px solid var(--brand);background:var(--brand);color:#fff;font:500 16px/1 var(--font);text-decoration:none;cursor:pointer;transition:transform .15s,opacity .2s;padding:0 16px;text-align:center}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.35;pointer-events:none}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--line)}
.btn.wa{background:#25d366;border-color:#25d366}
.btn svg{width:20px;height:20px;flex:none}
.btn+.btn{margin-top:10px}
.btn:focus-visible,.opt:focus-visible,.n:focus-visible,.back:focus-visible{outline:2px solid var(--brand-ink);outline-offset:2px}
.time{margin:12px 0 0;text-align:center;color:var(--muted);font-size:13px}
.q{margin:0;font-size:13px;color:var(--muted);letter-spacing:.04em}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:24px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;min-height:58px;padding:12px 16px;border-radius:16px;border:1px solid var(--line);background:var(--chip);color:var(--fg);font:400 17px/1.3 var(--font);cursor:pointer;transition:border-color .15s,background .15s,transform .15s}
.opt:active{transform:scale(.99)}
.opt .dot{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);flex:none;display:grid;place-items:center;background:var(--bg);transition:all .15s}
.opt[aria-checked="true"]{border-color:var(--brand);background:var(--sel)}
.opt[aria-checked="true"] .dot{background:var(--brand);border-color:var(--brand)}
.opt[aria-checked="true"] .dot:after{content:"";width:9px;height:5px;border:2px solid #fff;border-top:0;border-right:0;transform:translateY(-1px) rotate(-45deg)}
.nps{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:28px}
.n{aspect-ratio:1;border-radius:14px;border:1px solid var(--line);background:var(--chip);color:var(--fg);font:400 20px/1 var(--font);cursor:pointer;font-variant-numeric:tabular-nums;transition:all .15s}
.n[aria-checked="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.ends{display:flex;justify-content:space-between;margin-top:10px;font-size:13px;color:var(--muted)}
label.f{display:block;margin-top:18px;font-size:13px;color:var(--muted);letter-spacing:.04em}
input[type=text],input[type=tel]{width:100%;margin-top:6px;border:1px solid var(--line);border-radius:14px;background:var(--chip);color:var(--fg);font:400 17px/1.4 var(--font);padding:13px 16px}
input:focus{outline:none;border-color:var(--brand)}
.check{display:flex;gap:12px;align-items:flex-start;margin-top:20px;font-size:14px;color:var(--muted);cursor:pointer}
.check input{width:22px;height:22px;flex:none;margin:0;accent-color:var(--brand)}
.nav{display:flex;gap:10px;margin-top:24px}
.back{flex:none;width:54px;min-height:54px;border-radius:16px;border:1px solid var(--line);background:transparent;color:var(--muted);display:grid;place-items:center;cursor:pointer}
.back svg{width:20px;height:20px}
.err{color:#c0392b;font-size:14px;margin:12px 0 0;text-align:center;min-height:1em}
/* risultato */
.score{display:flex;align-items:center;gap:20px;margin-top:22px}
.ring{width:118px;height:118px;flex:none;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:10}
.ring .bg{stroke:var(--line)}
.ring .fg{stroke:var(--brand);stroke-linecap:round;transition:stroke-dashoffset 1.2s ease}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:34px;font-weight:500;color:var(--fg);font-variant-numeric:tabular-nums}
.ring b small{display:block;font-size:12px;color:var(--muted);font-weight:400;text-align:center;margin-top:-4px}
.verdict b{display:block;font-size:20px;font-weight:500;color:var(--fg);line-height:1.25}
.verdict span{display:block;color:var(--muted);font-size:14px;margin-top:4px}
.weak{margin-top:24px;display:flex;flex-direction:column;gap:10px}
.weak h3{margin:0 0 2px;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:500}
.w{border:1px solid var(--line);border-left:4px solid var(--banana);border-radius:14px;padding:14px 16px}
.w b{display:block;font-weight:500;font-size:16px}
.w span{display:block;margin-top:6px;font-size:14px;color:var(--muted)}
.w span em{font-style:normal;color:var(--brand-ink);font-weight:500}
.box{margin-top:22px;border:1px solid var(--brand);background:var(--sel);border-radius:18px;padding:18px}
.box p{margin:0 0 14px;font-size:15px}
.box p b{font-weight:500}
.foot{margin-top:28px;text-align:center;color:var(--muted);font-size:12px}
.foot .logo{margin:0 auto 6px}
</style>
</head>
<body>
<main class="app">
  <div class="bar" id="bar" aria-hidden="true"></div>
  <div id="pages"></div>
</main>
<script>
(function(){
// Il link /exec dello script nel foglio "Filo · Vendita gestionale". Finché è vuoto la pagina funziona ma non salva.
var ENDPOINT="";
var ENZO="393460356595";
var PROVA="https://link.skinem.it/filo/";
var LOGO='<svg class="logo" role="img" aria-label="Filo percorso 1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 451.2 112"><g transform="translate(4 4)"><path d="M6.6 29.5H56.5V40.9H20.2V55.9H52.5V67.2H20.2V96H6.6Z" fill="currentColor"/><path d="M71.6 29.5H85.1V96H71.6Z" fill="#00B3E6"/><path d="M113.8 29.5V84.7H143.9V96H100.2V29.5Z" fill="currentColor"/><path d="M217.3 38.3Q227.4 48 227.4 62.9Q227.4 77.7 217.4 87.4Q207.5 97.2 192.3 97.2Q177.2 97.2 167.1 87.4Q157.1 77.7 157.1 62.9Q157.1 48 167.1 38.2Q177.2 28.4 192.3 28.4Q207.5 28.4 217.3 38.3ZM177 47.2Q171.1 53.2 171.1 62.9Q171.1 72.5 177 78.6Q182.9 84.7 192.2 84.7Q201.5 84.7 207.4 78.6Q213.4 72.5 213.4 62.9Q213.4 53.2 207.4 47.1Q201.5 41.1 192.2 41.1Q182.9 41.1 177 47.2Z" fill="currentColor"/><rect x="254.1" y="14" width="2" height="84" fill="currentColor" opacity="0.3"/><path d="M288.6 52.9Q292 52.9 294.2 55.3Q296.4 57.8 296.4 61.6Q296.4 65.5 294.2 67.9Q292 70.4 288.6 70.4Q286.6 70.4 284.9 69.4Q283.2 68.4 282.2 66.6V76.8H280.4V53.2H282.2V56.6Q283.2 54.9 284.9 53.9Q286.6 52.9 288.6 52.9ZM283.9 56.5Q282.1 58.5 282.1 61.6Q282.1 64.8 283.9 66.8Q285.6 68.7 288.4 68.7Q291.1 68.7 292.8 66.8Q294.6 64.8 294.6 61.6Q294.6 58.5 292.8 56.5Q291.1 54.5 288.4 54.5Q285.6 54.5 283.9 56.5Z" fill="currentColor"/><path d="M314.7 55.3Q317 57.8 317 61.6Q317 62.2 317 62.5H303Q303.2 65.3 305 67Q306.8 68.7 309.6 68.7Q313 68.7 314.7 66.5L316.3 67.2Q314.1 70.4 309.6 70.4Q305.7 70.4 303.4 68Q301.1 65.5 301.1 61.6Q301.1 57.9 303.3 55.4Q305.5 52.9 309 52.9Q312.5 52.9 314.7 55.3ZM304.8 56.3Q303.1 58.1 302.9 61H315.1Q314.9 58.1 313.3 56.3Q311.6 54.5 309 54.5Q306.5 54.5 304.8 56.3Z" fill="currentColor"/><path d="M329.7 52.9H330V55Q329.1 54.8 328.1 54.8Q326.6 54.8 325.4 55.8Q324.2 56.8 324.2 58.9V70H322.4V53.2H324.2V55.7Q324.8 54.7 326.3 53.8Q327.8 52.9 329.7 52.9Z" fill="currentColor"/><path d="M342 52.9Q344.1 52.9 345.8 53.8Q347.5 54.8 348.6 56.5L346.9 57.2Q345.2 54.5 342 54.5Q339.3 54.5 337.6 56.5Q335.9 58.5 335.9 61.6Q335.9 64.8 337.6 66.8Q339.3 68.7 342 68.7Q345.2 68.7 346.9 66L348.6 66.8Q347.5 68.5 345.8 69.5Q344.1 70.4 342 70.4Q338.5 70.4 336.3 67.9Q334 65.5 334 61.6Q334 57.8 336.3 55.3Q338.5 52.9 342 52.9Z" fill="currentColor"/><path d="M366.6 55.4Q368.9 57.8 368.9 61.6Q368.9 65.5 366.6 67.9Q364.4 70.4 360.9 70.4Q357.5 70.4 355.2 67.9Q352.9 65.5 352.9 61.6Q352.9 57.8 355.2 55.3Q357.5 52.9 360.9 52.9Q364.4 52.9 366.6 55.4ZM356.5 56.5Q354.8 58.5 354.8 61.6Q354.8 64.8 356.5 66.8Q358.2 68.7 360.9 68.7Q363.6 68.7 365.3 66.8Q367 64.8 367 61.6Q367 58.5 365.3 56.5Q363.6 54.5 360.9 54.5Q358.2 54.5 356.5 56.5Z" fill="currentColor"/><path d="M381.6 52.9H381.9V55Q381 54.8 380 54.8Q378.5 54.8 377.3 55.8Q376 56.8 376 58.9V70H374.2V53.2H376V55.7Q376.7 54.7 378.2 53.8Q379.6 52.9 381.6 52.9Z" fill="currentColor"/><path d="M392.1 52.8Q393.6 52.8 395 53.3Q396.5 53.9 397.7 55L396.6 56.4Q395.6 55.3 394.5 54.9Q393.3 54.4 392.1 54.4Q390.4 54.4 389.2 55.3Q388.3 56 388.3 57.3Q388.3 58.7 389.5 59.4Q390.2 59.8 392.7 60.6Q395.2 61.3 396.3 62Q398.1 63.3 398.1 65.6Q398.1 67.8 396.4 69.1Q394.8 70.4 392.1 70.4Q390.3 70.4 388.7 69.9Q387.2 69.3 385.9 68L387 66.6Q388.1 67.8 389.4 68.3Q390.6 68.8 392.1 68.8Q394 68.8 395.1 68Q396.3 67 396.3 65.6Q396.3 64.1 395.1 63.4Q394.2 62.9 392 62.2Q389.1 61.4 388.4 60.8Q386.5 59.5 386.5 57.4Q386.5 55.3 387.9 54.1Q389.6 52.8 392.1 52.8Z" fill="currentColor"/><path d="M416.5 55.4Q418.8 57.8 418.8 61.6Q418.8 65.5 416.5 67.9Q414.3 70.4 410.8 70.4Q407.3 70.4 405.1 67.9Q402.8 65.5 402.8 61.6Q402.8 57.8 405.1 55.3Q407.3 52.9 410.8 52.9Q414.3 52.9 416.5 55.4ZM406.4 56.5Q404.7 58.5 404.7 61.6Q404.7 64.8 406.4 66.8Q408.1 68.7 410.8 68.7Q413.5 68.7 415.2 66.8Q416.9 64.8 416.9 61.6Q416.9 58.5 415.2 56.5Q413.5 54.5 410.8 54.5Q408.1 54.5 406.4 56.5Z" fill="currentColor"/><path d="" fill="currentColor"/><path d="M440 46.5H441.5V70H439.6V48.7L435.6 50.8L434.8 49.2Z" fill="currentColor"/></g></svg>';
var ARROW='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>';
var WA='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2c-1.5 0-3-.4-4.3-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.7-1.4.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6.5-.1 1.5-.6 1.7-1.2s.2-1.1.2-1.2-.3-.2-.5-.3z"/></svg>';

// Le domande. p = quanto pesa la risposta sul filo che si spezza (0 = tutto bene).
var QS=[
 {k:'sparite',q:'Negli ultimi 3 mesi, quante clienti <b>hanno smesso di venire</b> senza che ve ne accorgeste?',
  o:[['Nessuna, le seguiamo tutte',0],['Qualcuna',2],['Più di dieci',3],['Non lo so',3]],
  deb:'Clienti che spariscono in silenzio',fix:'gli <em>avvisi</em> ti dicono chi non viene da 30 giorni, con il bottone per scriverle.'},
 {k:'memoria',q:'Quando una cliente torna, l\'operatrice sa <b>cosa le avevate proposto</b> l\'ultima volta?',
  o:[['Sì, è sempre scritto',0],['Solo se se lo ricorda',2],['No',3]],
  deb:'La storia della cliente sta nella testa delle operatrici',fix:'la <em>fiche cliente</em> mostra l\'ultima volta e cosa fare oggi, prima di entrare in cabina.'},
 {k:'vendita',q:'Chi propone il percorso <b>o il prodotto per casa?</b>',
  o:[['Tutte, con le stesse frasi',0],['Solo io',2],['Ognuna a modo suo',2],['Aspettiamo che lo chieda la cliente',3]],
  deb:'La vendita dipende da chi c\'è in cabina',fix:'con <em>Prepara domani</em> lasci a ogni operatrice le indicazioni e la frase giusta.'},
 {k:'dopo',q:'Dopo il trattamento <b>chiedete com\'è andata?</b>',
  o:[['Sì, con un messaggio o un questionario',0],['A voce, alla cassa',1],['No',3]],
  deb:'Non sai cosa pensa davvero la cliente quando esce',fix:'un tocco e parte il <em>questionario d\'uscita</em> su WhatsApp, col nome del tuo centro.'},
 {k:'promemoria',q:'Il giorno prima <b>mandate il promemoria</b> dell\'appuntamento?',
  o:[['Sì, a tutte',0],['Qualche volta',1],['No',2]],
  deb:'Buchi in agenda per appuntamenti dimenticati',fix:'la lista di domani è già pronta: un tocco per ogni <em>promemoria</em>.'},
 {k:'agenda',q:'Dove prendete <b>gli appuntamenti?</b>',
  o:[['Agenda di carta',0],['Google Agenda',0],['Un\'app (Treatwell, SiBook…)',0],['Un altro gestionale',0]]},
 {k:'cabina',q:'Quante siete <b>in cabina?</b>',
  o:[['Solo io',0],['Due o tre',0],['Quattro o più',0]]}
];
var MAX=QS.reduce(function(s,x){return s+Math.max.apply(null,x.o.map(function(o){return o[1]}))},0);

var P=new URLSearchParams(location.search);
var A={}, voto=0, step=0, sent=false;
var pages=[], el=document.getElementById('pages'), bar=document.getElementById('bar');
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

function cover(){return '<section class="page">'+LOGO+
 '<div class="filo" aria-hidden="true"><svg viewBox="0 0 320 120"><path d="M20 90 C 70 10, 120 10, 160 60 S 250 110, 300 30"/>'+
 '<circle class="p" cx="20" cy="90" r="9"/><circle class="p" cx="300" cy="30" r="9"/><circle class="p" cx="88" cy="32" r="7"/><circle class="p" cx="232" cy="88" r="7"/><circle class="c" cx="160" cy="60" r="16"/></svg></div>'+
 '<p class="k">Test per titolari · 1 minuto</p>'+
 '<h1>Il tuo centro <b>tiene il filo</b> con le sue clienti?</h1>'+
 '<p class="lead">'+(P.get('n')?esc(P.get('n'))+', s':'S')+'ette domande veloci. Alla fine vedi il tuo punteggio e dove il centro perde clienti senza accorgersene.</p>'+
 '<div class="sp"></div><button class="btn" data-go="1">Inizia il test</button><p class="time">Nessun impegno · dal telefono</p></section>'}

function domanda(x,i){return '<section class="page"><p class="q">Domanda '+(i+1)+' di '+QS.length+'</p><h2>'+x.q+'</h2>'+
 '<div class="opts" role="radiogroup">'+x.o.map(function(o,j){return '<button class="opt" role="radio" aria-checked="false" data-k="'+x.k+'" data-j="'+j+'"><span class="dot"></span><span>'+o[0]+'</span></button>'}).join('')+'</div>'+
 '<div class="sp"></div><div class="nav"><button class="back" aria-label="Indietro">'+ARROW+'</button></div></section>'}

function pagVoto(){var n='';for(var i=1;i<=10;i++)n+='<button class="n" role="radio" aria-checked="false" data-v="'+i+'">'+i+'</button>';
 return '<section class="page"><p class="q">Ultima domanda</p><h2>Da 1 a 10, quanto ti servirebbe <b>un sistema che fa queste cose al posto tuo?</b></h2>'+
 '<div class="nps" role="radiogroup">'+n+'</div><div class="ends"><span>Per niente</span><span>Moltissimo</span></div>'+
 '<div class="sp"></div><div class="nav"><button class="back" aria-label="Indietro">'+ARROW+'</button></div></section>'}

function contatti(){return '<section class="page"><p class="k">Il tuo risultato è pronto</p><h2>Dove ti <b>scrivo?</b></h2>'+
 '<p class="lead">Ti serve solo per vedere il punteggio. Nessuna newsletter.</p>'+
 '<label class="f" for="cNome">Il tuo nome</label><input type="text" id="cNome" autocomplete="given-name" autocapitalize="words" value="'+esc(P.get('n')||'')+'">'+
 '<label class="f" for="cCentro">Nome del centro</label><input type="text" id="cCentro" autocomplete="organization" value="'+esc(P.get('c')||'')+'">'+
 '<label class="f" for="cCitta">Città</label><input type="text" id="cCitta" autocomplete="address-level2" autocapitalize="words">'+
 '<label class="f" for="cTel">WhatsApp</label><input type="tel" id="cTel" inputmode="tel" autocomplete="tel" placeholder="es. 333 123 4567">'+
 '<label class="check"><input type="checkbox" id="cOk"><span>Acconsento a essere ricontattata da Enzo Evandri · Skinem Group su WhatsApp per questo test. I dati non vengono dati a nessuno.</span></label>'+
 '<p class="err" id="cErr"></p><div class="sp"></div>'+
 '<div class="nav"><button class="back" aria-label="Indietro">'+ARROW+'</button><button class="btn" id="cGo">Vedi il mio risultato</button></div></section>'}

function calcola(){
 var perso=0, deb=[];
 QS.forEach(function(x){var j=A[x.k];if(j==null||!x.deb)return;var p=x.o[j][1];perso+=p;if(p>=2)deb.push({p:p,x:x})});
 deb.sort(function(a,b){return b.p-a.p});
 return {punti:Math.round(100-perso/MAX*100), deb:deb.slice(0,3)};
}
function fascia(){return voto>=9?'Calda':voto>=4?'Tiepida':'Fredda'}

function risultato(){
 var r=calcola(), nome=esc(val('cNome')), cen=esc(val('cCentro'));
 var v=r.punti>=75?['Il filo è forte','Il centro segue bene le sue clienti. Filo ti fa risparmiare il tempo per restare così.']:
       r.punti>=50?['Il filo regge, ma perde pezzi','Alcune clienti scivolano via in punti precisi. Eccoli.']:
                   ['Il filo si spezza spesso','Il centro lavora tanto per far entrare clienti nuove e ne perde per strada. Ecco dove.'];
 var h='<section class="page"><p class="k">Il tuo punteggio di continuità</p><h2>'+nome+', ecco <b>'+(cen||'il tuo centro')+'</b></h2>'+
  '<div class="score"><div class="ring"><svg viewBox="0 0 120 120"><circle class="bg" cx="60" cy="60" r="52"/><circle class="fg" id="arc" cx="60" cy="60" r="52" stroke-dasharray="326.7" stroke-dashoffset="326.7"/></svg><b><span>'+r.punti+'<small>su 100</small></span></b></div>'+
  '<div class="verdict"><b>'+v[0]+'</b><span>'+v[1]+'</span></div></div>';
 if(r.deb.length) h+='<div class="weak"><h3>Dove perdi clienti</h3>'+r.deb.map(function(d){return '<div class="w"><b>'+d.x.deb+'</b><span>Con Filo: '+d.x.fix+'</span></div>'}).join('')+'</div>';
 var msg='Ciao Enzo, sono '+val('cNome')+' di '+val('cCentro')+'. Ho fatto il test di Filo ('+r.punti+'/100): ';
 if(voto>=9) h+='<div class="box"><p><b>Ti faccio vedere come funziona.</b> Apri la prova di Filo: un centro di esempio sul tuo telefono, puoi toccare tutto.</p>'+
   '<a class="btn" href="'+PROVA+'" target="_blank" rel="noopener">Apri la prova di Filo</a>'+
   '<a class="btn wa" href="https://wa.me/'+ENZO+'?text='+encodeURIComponent(msg+'vorrei vederlo nel mio centro.')+'" target="_blank" rel="noopener">'+WA+'Scrivi a Enzo</a></div>';
 else if(voto>=4) h+='<div class="box"><p><b>Grazie, '+nome+'.</b> Nei prossimi giorni ti mando una cosa sola: quella che serve di più al tuo centro.</p>'+
   '<a class="btn ghost" href="'+PROVA+'" target="_blank" rel="noopener">Sei curiosa? Apri la prova</a></div>';
 else h+='<div class="box"><p><b>Grazie per il tuo tempo, '+nome+'.</b> Se un giorno vuoi parlarne, sono qui.</p>'+
   '<a class="btn ghost" href="https://wa.me/'+ENZO+'?text='+encodeURIComponent(msg+'ho una domanda.')+'" target="_blank" rel="noopener">Scrivi a Enzo</a></div>';
 h+='<div class="foot">'+LOGO.replace('class="logo"','class="logo sm"')+'Enzo Evandri · Skinem Group</div></section>';
 return {html:h,r:r};
}
function val(id){var e=document.getElementById(id);return e?e.value.trim():''}

function build(){
 pages=[cover()].concat(QS.map(domanda)).concat([pagVoto(),contatti()]);
 el.innerHTML=pages.join('')+'<section class="page" id="fine"></section>';
 bar.innerHTML=QS.map(function(){return '<i></i>'}).join('')+'<i></i><i></i>';
 show(0);
}
function all(){return el.querySelectorAll('.page')}
function show(i){step=i;[].forEach.call(all(),function(p,j){p.classList.toggle('on',j===i)});
 [].forEach.call(bar.children,function(b,j){b.classList.toggle('on',j<i)});bar.hidden=i===0;window.scrollTo(0,0)}

el.addEventListener('click',function(e){
 var t=e.target.closest('button');if(!t)return;
 if(t.hasAttribute('data-go')){show(1);return}
 if(t.classList.contains('back')){show(step-1);return}
 if(t.classList.contains('opt')){[].forEach.call(t.parentNode.children,function(x){x.setAttribute('aria-checked',x===t?'true':'false')});
  A[t.getAttribute('data-k')]=+t.getAttribute('data-j');setTimeout(function(){show(step+1)},260);return}
 if(t.classList.contains('n')){[].forEach.call(t.parentNode.children,function(x){x.setAttribute('aria-checked',x===t?'true':'false')});
  voto=+t.getAttribute('data-v');setTimeout(function(){show(step+1)},260);return}
 if(t.id==='cGo'){
  var err=document.getElementById('cErr');
  if(!val('cNome')||!val('cCentro')){err.textContent='Scrivi il tuo nome e il nome del centro.';return}
  if(val('cTel').replace(/\D/g,'').length<9){err.textContent='Controlla il numero WhatsApp.';return}
  if(!document.getElementById('cOk').checked){err.textContent='Serve il consenso per ricontattarti.';return}
  err.textContent='';
  var out=risultato(), fine=document.getElementById('fine');fine.innerHTML=out.html.replace(/^<section class="page">|<\/section>$/g,'');
  show(all().length-1);
  setTimeout(function(){var a=document.getElementById('arc');if(a)a.style.strokeDashoffset=326.7*(1-out.r.punti/100)},80);
  invia(out.r);
 }
});

function invia(r){
 if(sent||ENDPOINT.indexOf('https://')!==0)return;sent=true;
 var d={tipo:'filo-test',nome:val('cNome'),centro:val('cCentro'),citta:val('cCitta'),tel:val('cTel'),consenso:'Sì',
  punteggio:r.punti,voto:voto,fascia:fascia(),deboli:r.deb.map(function(x){return x.x.deb}).join(' · '),
  fix:r.deb.length?r.deb[0].x.fix.replace(/<[^>]+>/g,''):'',fonte:P.get('s')||''};
 QS.forEach(function(x){d[x.k]=A[x.k]==null?'':x.o[A[x.k]][0]});
 try{fetch(ENDPOINT,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(d)})}catch(e){}
}
build();
})();
</script>
</body>
</html>
