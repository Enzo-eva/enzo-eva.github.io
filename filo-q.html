:root{
  --bg:#ffffff;--fg:#3a3a39;--muted:#7a7c7d;--brand:#00B3E6;--brand-ink:#0089b0;--grey:#575756;
  --line:#e2e8ec;--chip:#f3f8fb;--sel:#e3f6fc;
  --font:"Larke Neue","Avenir Next","Century Gothic","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1417;--fg:#e8eef1;--muted:#98a4aa;--brand:#19bdec;--brand-ink:#5fd3f5;--grey:#c9cfd2;--line:#253038;--chip:#172025;--sel:#0f3341;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1417;--fg:#e8eef1;--muted:#98a4aa;--brand:#19bdec;--brand-ink:#5fd3f5;--grey:#c9cfd2;--line:#253038;--chip:#172025;--sel:#0f3341;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
.app{max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;position:relative}
.bar{display:flex;gap:5px;padding:14px 20px 0;padding-top:max(14px,env(safe-area-inset-top))}
.bar i{flex:1;height:3px;border-radius:3px;background:var(--line);transition:background .3s}
.bar i.on{background:var(--brand)}
.app.cover-on .bar{position:absolute;inset:0 0 auto 0;z-index:2}
.app.cover-on .bar i{background:rgba(255,255,255,.45)}
.app.cover-on .bar i.on{background:#fff}

.page{display:none;flex:1;flex-direction:column;padding:28px 24px 24px;padding-bottom:max(24px,env(safe-area-inset-bottom));animation:in .35s ease}
.page.on{display:flex}
@keyframes in{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}

/* copertina */
.p0{padding:0}
.hero{position:relative;aspect-ratio:4/4.2;max-height:56dvh;width:100%;overflow:hidden;background:var(--chip)}
.hero img{width:100%;height:100%;object-fit:cover;object-position:center 15%;display:block}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.28) 0%,rgba(0,0,0,0) 30%,rgba(0,0,0,0) 60%,rgba(0,0,0,.45) 100%)}
.hero .lg-sk{position:absolute;left:24px;bottom:22px;z-index:1;background:#fff;height:22px;width:120px}
.p0 .in{padding:24px 24px 0;display:flex;flex-direction:column;flex:1;padding-bottom:max(24px,env(safe-area-inset-bottom))}
.k{margin:0;font-size:12px;font-weight:500;letter-spacing:.24em;text-transform:uppercase;color:var(--brand-ink)}
h1,h2{font-weight:300;color:var(--grey);margin:8px 0 0;line-height:1.15;text-wrap:balance}
h1{font-size:30px}
h2{font-size:26px}
h1 b,h2 b{font-weight:500;color:var(--fg)}
.lead{margin:12px 0 0;color:var(--muted);font-size:16px;max-width:34ch}
.sp{flex:1;min-height:20px}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:54px;width:100%;border-radius:16px;border:1px solid var(--brand);background:var(--brand);color:#fff;font:500 16px/1 var(--font);text-decoration:none;cursor:pointer;transition:transform .15s,opacity .2s}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.35;pointer-events:none}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--line)}
.btn svg{width:20px;height:20px;flex:none}
.btn:focus-visible,.opt:focus-visible,.n:focus-visible{outline:2px solid var(--brand-ink);outline-offset:2px}
.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}
.row .btn{min-height:48px;font-size:14px;background:var(--chip);border-color:var(--line);color:var(--fg)}
.row .btn svg{width:18px;height:18px;color:var(--brand-ink)}
.time{margin:12px 0 0;text-align:center;color:var(--muted);font-size:13px}

/* domande */
.q{margin:0;font-size:13px;color:var(--muted);letter-spacing:.04em}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:24px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;min-height:58px;padding:12px 16px;border-radius:16px;border:1px solid var(--line);background:var(--chip);color:var(--fg);font:400 17px/1.3 var(--font);cursor:pointer;transition:border-color .15s,background .15s,transform .15s}
.opt:active{transform:scale(.99)}
.opt .dot{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);flex:none;display:grid;place-items:center;transition:all .15s;background:var(--bg)}
.opts.multi .opt .dot{border-radius:7px}
.opt[aria-pressed="true"],.opt[aria-checked="true"]{border-color:var(--brand);background:var(--sel)}
.opt[aria-pressed="true"] .dot,.opt[aria-checked="true"] .dot{background:var(--brand);border-color:var(--brand)}
.opt[aria-pressed="true"] .dot:after,.opt[aria-checked="true"] .dot:after{content:"";width:9px;height:5px;border:2px solid #fff;border-top:0;border-right:0;transform:translateY(-1px) rotate(-45deg)}

.nps{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:28px}
.n{aspect-ratio:1;border-radius:14px;border:1px solid var(--line);background:var(--chip);color:var(--fg);font:400 19px/1 var(--font);cursor:pointer;font-variant-numeric:tabular-nums;transition:all .15s}
.n[aria-checked="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.ends{display:flex;justify-content:space-between;margin-top:10px;font-size:13px;color:var(--muted)}

label.f{display:block;margin-top:22px;font-size:13px;color:var(--muted);letter-spacing:.04em}
textarea,input[type=text]{width:100%;margin-top:6px;border:1px solid var(--line);border-radius:14px;background:var(--chip);color:var(--fg);font:400 17px/1.4 var(--font);padding:14px 16px}
textarea{min-height:130px;resize:vertical}
textarea:focus,input:focus{outline:none;border-color:var(--brand)}

.nav{display:flex;gap:10px;margin-top:24px}
.back{flex:none;width:54px;min-height:54px;border-radius:16px;border:1px solid var(--line);background:transparent;color:var(--muted);display:grid;place-items:center;cursor:pointer}
.back svg{width:20px;height:20px}

/* fine */
.ok{width:72px;height:72px;border-radius:50%;background:var(--sel);display:grid;place-items:center;color:var(--brand-ink);margin-top:12px}
.ok svg{width:34px;height:34px}
.box{margin-top:22px;border:1px solid var(--line);border-radius:18px;padding:18px}
.box p{margin:0 0 14px;font-size:15px;color:var(--fg)}
.box+.box{margin-top:12px}
.foot{margin-top:28px;display:flex;justify-content:center}
.foot .lg-sk{width:96px;height:16px;opacity:.8}
.follow{border-color:var(--brand);background:var(--sel)}
.igh{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.igav{width:44px;height:44px;border-radius:50%;background:linear-gradient(45deg,#f9ce34,#ee2a7b,#6228d7);display:grid;place-items:center;color:#fff;flex:none}
.igav svg{width:22px;height:22px}
.igh b{display:block;font-weight:500;font-size:16px;color:var(--fg)}
.igh small{color:var(--muted);font-size:13px}
.err{color:#c0392b;font-size:13px;margin-top:10px;text-align:center}
</style><style>
.in-pad{display:flex;flex-direction:column;flex:1;padding-top:24px}

.gift{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px;border-color:var(--brand);background:var(--sel)}
.gift p{margin:0;font-size:15px}
</style>

   '<div class="opts" role="radiogroup">'+x.o.map(function(o,j){return '<button class="opt" role="radio" aria-checked="false" data-j="'+j+'"><span class="dot"></span>'+esc(o)+'</button>'}).join('')+'</div>'+
   (x.txt!=null?'<div class="txt" hidden><label class="f" for="t'+i+'">Scrivi qui la tua domanda</label><textarea id="t'+i+'" rows="3" maxlength="300"></textarea><button class="btn" data-next style="margin-top:12px">Avanti</button></div>':'')+
   '<div class="sp"></div>'+back+'</section>';
});
html+='<section class="page" data-p="'+N+'"><p class="q">'+N+' di '+N+'</p><h2>'+C.voto+'</h2><div class="nps" role="radiogroup" id="nps"></div><div class="ends"><span>Per niente</span><span>Assolutamente</span></div><div class="sp"></div>'+back+'</section>';
html+='<section class="page" data-p="'+(N+1)+'"><div class="ok"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div><h2 id="thx">Grazie. <b>Ci vediamo presto.</b></h2><p class="lead">Leggiamo ogni risposta, una per una.</p><div class="box follow" id="boxAmica" hidden><p>Ti sei trovata così bene? Regala a un\'amica il suo primo viso da noi.</p><a class="btn" id="amicaBtn" target="_blank" rel="noopener">Invita un\'amica su WhatsApp</a></div><div class="sp"></div></section>';
P.innerHTML=html;
var pages=[].slice.call(P.querySelectorAll('.page')),cur=0,LAST=pages.length-1;
for(var i=1;i<LAST;i++)bar.appendChild(document.createElement('i'));
function go(n){pages[cur].classList.remove('on');cur=Math.max(0,Math.min(LAST,n));pages[cur].classList.add('on');bar.hidden=(cur===LAST||cur===0);[].forEach.call(bar.children,function(b,i){b.classList.toggle('on',i<cur)});window.scrollTo(0,0)}
bar.hidden=true;
P.addEventListener('click',function(e){
  var nx=e.target.closest('[data-next]'),bk=e.target.closest('[data-back]'),op=e.target.closest('.opt');
  if(nx){var pg=nx.closest('.page'),ta=pg.querySelector('textarea');if(ta&&ta.value.trim())A[pg.dataset.key+'_testo']=ta.value.trim();go(cur+1);return}
  if(bk){go(cur-1);return}
  if(op){var pg2=op.closest('.page');pg2.querySelectorAll('.opt').forEach(function(x){x.setAttribute('aria-checked','false')});op.setAttribute('aria-checked','true');
    A[pg2.dataset.key]=op.textContent.trim();var tx=pg2.querySelector('.txt');
    if(tx&&op.dataset.j==='1'){tx.hidden=false;tx.querySelector('textarea').focus();return}
    if(tx)tx.hidden=true;setTimeout(function(){go(cur+1)},260)}
});
var nps=document.getElementById('nps');
for(var n=0;n<=10;n++){(function(n){var b=document.createElement('button');b.className='n';b.setAttribute('role','radio');b.setAttribute('aria-checked','false');b.textContent=n;
  b.onclick=function(){nps.querySelectorAll('.n').forEach(function(x){x.setAttribute('aria-checked','false')});b.setAttribute('aria-checked','true');A.voto=n;setTimeout(fine,260)};nps.appendChild(b)})(n)}
nps.style.gridTemplateColumns='repeat(6,1fr)';
function send(d){try{fetch(ENDPOINT,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(d)})}catch(e){}}
function fine(){
  send({centro:'Prova Filo · '+C.nome,operatrice:(qs.get('op')||'').slice(0,40),sensazione:A.q1||'',notato:A.q2||'',spiegazione:(A.q3||'')+(A.q3_testo?' — '+A.q3_testo:''),prossimo:'',consiglio:A.voto,commento:'',nome:nome});
  if(nome)document.getElementById('thx').innerHTML='Grazie, '+esc(nome)+'. <b>Ci vediamo presto.</b>';
  if(A.voto>=9){var u=location.href.split('?')[0]+'?t=amica&nome='+encodeURIComponent(nome||'');
    document.getElementById('boxAmica').hidden=false;
    document.getElementById('amicaBtn').href='https://wa.me/?text='+encodeURIComponent('Ti faccio un regalo: il tuo primo viso da '+CENTRO+'. Apri qui 👇\n'+u)}
  go(LAST)
}
})();
</script>
</body>
</html>
