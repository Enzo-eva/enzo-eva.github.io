<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8"><meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fase — piattaforma</title>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  @font-face{font-family:"Larke";src:url(../font/larke-100.woff2) format("woff2");font-weight:100 300}
  @font-face{font-family:"Larke";src:url(../font/larke-400.woff2) format("woff2");font-weight:400}
  @font-face{font-family:"Larke";src:url(../font/larke-600.woff2) format("woff2");font-weight:500 600}
  :root{--perla:#F3F0F9;--antracite:#5A4D86;--scuro:#3D3360;--celeste:#8E7CC6;--fumetto:#E6DEF6;--testo:#3a3450;--muto:#8C84A3;--r:28px;--si:#2e9e6b;--cau:#d9962b;--no:#c9483f}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--perla);color:var(--testo);font-family:"Larke","Jost",system-ui,sans-serif;font-weight:300;font-size:16px;line-height:1.5}
  .wrap{max-width:900px;margin:0 auto;padding:16px 14px 50px}
  .lab{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--muto);font-weight:400}
  h1,h2{font-weight:300;letter-spacing:.14em;text-transform:uppercase;margin:0}
  .hero{display:flex;flex-direction:column-reverse;background:linear-gradient(135deg,#C9BCEB,#A694D9 55%,#8E7CC6)!important;position:relative;border-radius:var(--r);overflow:hidden;margin-bottom:18px;box-shadow:0 26px 40px -28px rgba(61,51,96,.55);background:#A897D8}
  .hero svg{display:block;width:100%;height:auto;margin-top:-10px}
  .hero .txt{position:relative;padding:24px 24px 0;color:#fff}
  .hero .lab{color:#F1ECFB}
  .hero h1{font-size:30px;letter-spacing:.32em;margin:6px 0 4px;font-weight:300}
  .hero p{margin:0;font-size:13px;color:#F4F0FC;max-width:330px}
  .card{background:#fff;border-radius:var(--r);padding:22px 20px;margin-bottom:14px}
  .card h2{font-size:15px;margin:6px 0 4px}
  .num{color:var(--celeste);font-weight:400;margin-right:6px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px}
  label.f{display:block;font-size:13px;color:var(--muto);margin:12px 0 6px}
  input[type=text],input[type=number],input[type=date],select{width:100%;border:1px solid #E3DCF0;background:#FBFAFE;border-radius:16px;padding:12px 14px;font:inherit;font-weight:400;color:var(--testo);-webkit-appearance:none;appearance:none;min-height:48px}
  select{background-image:linear-gradient(45deg,transparent 50%,#8C84A3 50%),linear-gradient(135deg,#8C84A3 50%,transparent 50%);background-position:calc(100% - 20px) 21px,calc(100% - 15px) 21px;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
  .checks{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
  .ck{display:flex;gap:10px;align-items:flex-start;background:#FBFAFE;border:1px solid #ECE6F6;border-radius:16px;padding:11px 13px;font-size:14px;line-height:1.35;cursor:pointer}
  .ck input{width:18px;height:18px;margin:1px 0 0;accent-color:#8E7CC6;flex:0 0 18px}
  .ck.full{grid-column:1/-1}
  .hint{font-size:13px;color:var(--muto);margin-top:8px}
  .btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:0;border-radius:999px;background:var(--fumetto);color:var(--scuro);font:inherit;font-weight:400;letter-spacing:.16em;text-transform:uppercase;font-size:14px;padding:16px 18px;cursor:pointer;margin-top:10px}
  .btn::before{content:"";width:18px;height:1.5px;background:var(--scuro)}
  .btn.w{background:#fff;border:1px solid #E3DCF0}
  .stato{border-radius:20px;padding:14px 16px;font-weight:400;margin:4px 0 14px}
  .stato.ok{background:#e9f6ef;color:#20714c}.stato.cau{background:#fff3df;color:#8a5a10}.stato.no{background:#fde9e6;color:#9b3129}
  .fase-big{font-size:21px;letter-spacing:.16em;text-transform:uppercase;margin:6px 0}
  .tech{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-top:1px solid #EFEAF7}
  .tech:first-of-type{border-top:0}
  .dot{flex:0 0 12px;height:12px;border-radius:50%;margin-top:6px}
  .dot.s{background:var(--si)}.dot.c{background:var(--cau)}.dot.n{background:var(--no)}
  .tech b{font-weight:500}.tech small{display:block;color:var(--muto);font-size:13px;line-height:1.4}
  .star{color:var(--celeste);font-size:11px;letter-spacing:.16em;text-transform:uppercase;margin-left:6px}
  ul.l{margin:0;padding-left:18px}ul.l li{margin:6px 0}
  .say{background:var(--perla);border-radius:20px;padding:14px 16px;margin:10px 0;font-style:italic}
  .hide{display:none}
  .oggi{border:1.5px solid var(--celeste)}
  .rule{display:inline-block;font-size:10px;letter-spacing:.08em;background:var(--fumetto);color:var(--scuro);border-radius:999px;padding:1px 7px;margin-left:4px;vertical-align:1px;font-weight:400;font-style:normal}
  .az{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid #EFEAF7}
  .az:first-of-type{border-top:0}
  .az .n{flex:0 0 28px;height:28px;border-radius:50%;background:var(--celeste);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:400}
  .az b{font-weight:500}.az small{display:block;color:var(--muto);font-size:13px}
  .asp{background:#fff3df;color:#8a5a10;border-radius:16px;padding:10px 14px;margin-top:10px;font-size:14px}
  .strip{display:flex;gap:4px;margin:16px 0 6px}
  .sg{background:var(--perla);border-radius:12px;padding:8px 4px;text-align:center;min-width:0}
  .sg span{display:block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sg small{font-size:11px;color:var(--muto)}
  .sg.on{background:var(--fumetto);outline:1.5px solid var(--celeste)}
  .foot{font-size:12px;color:var(--muto);text-align:center;margin-top:18px;padding:0 10px}
  .res-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.res-grid .card{margin:0}
  @media(max-width:680px){.grid,.checks,.res-grid{grid-template-columns:1fr}}
  @media print{.noprint,.btn{display:none!important}body{background:#fff}.card{border:1px solid #ddd}.hero{box-shadow:none}}
  .cli{font-size:18px}
  .cli label.f{font-size:15px;color:var(--testo)}
  .cli select,.cli input{font-size:18px;min-height:54px}
  .cli .hint{font-size:15px}
  .figs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
  .fig{border:1.5px solid #ECE6F6;border-radius:20px;padding:10px 4px 10px;text-align:center;background:#FBFAFE;font:inherit;color:inherit;cursor:pointer}
  .fig.on{border-color:var(--celeste);background:var(--fumetto)}
  .fig svg{width:100%;height:auto;max-height:200px}
  .fig b{display:block;font-weight:500;font-size:12px;letter-spacing:.06em;text-transform:uppercase;margin-top:4px}
  .fig small{display:block;font-size:12px;color:var(--muto);line-height:1.3;margin-top:2px}
  .scala{display:grid;grid-template-columns:repeat(11,1fr);gap:4px}
  .scala button{border:1px solid #E3DCF0;background:#FBFAFE;border-radius:12px;padding:12px 0;font:inherit;font-size:16px;color:var(--testo);cursor:pointer}
  .scala button.on{background:var(--celeste);color:#fff;border-color:var(--celeste)}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border:1px solid #E3DCF0;background:#FBFAFE;border-radius:999px;padding:10px 16px;font:inherit;font-size:16px;color:var(--testo);cursor:pointer}
  .chip.on{background:var(--fumetto);border-color:var(--celeste)}
  .conf{display:flex;align-items:center;justify-content:center;gap:18px;margin-top:8px;text-align:center}
  .conf small{display:block;font-size:12px;color:var(--muto)}
  .conf .vs{font-size:34px;color:var(--celeste);font-weight:300}
  .pm{display:flex;gap:14px;align-items:flex-start;padding:12px 10px;border-radius:16px}
  .pm+.pm{margin-top:4px}
  .pm.on{background:var(--fumetto)}
  .pm .pg{flex:0 0 88px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--celeste);padding-top:3px}
  .pm b{font-weight:500}.pm small{display:block;color:var(--muto);font-size:14px}
  @media(max-width:520px){.figs{grid-template-columns:repeat(2,1fr)}.scala button{padding:10px 0;font-size:14px}}

  .figs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
  .fig{border:1.5px solid #ECE6F6;border-radius:20px;padding:10px 4px;text-align:center;background:#FBFAFE;font:inherit;color:inherit;cursor:pointer}
  .fig.on{border-color:var(--celeste);background:var(--fumetto)}
  .fig svg{width:100%;height:auto;max-height:190px}
  .fig b{display:block;font-weight:500;font-size:12px;letter-spacing:.06em;text-transform:uppercase;margin-top:4px}
  .fig small{display:block;font-size:12px;color:var(--muto);line-height:1.3;margin-top:2px}
  .scala{display:grid;grid-template-columns:repeat(11,1fr);gap:4px}
  .scala button{border:1px solid #E3DCF0;background:#FBFAFE;border-radius:12px;padding:11px 0;font:inherit;color:var(--testo);cursor:pointer}
  .scala button.on{background:var(--celeste);color:#fff;border-color:var(--celeste)}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border:1px solid #E3DCF0;background:#FBFAFE;border-radius:999px;padding:9px 15px;font:inherit;font-size:15px;color:var(--testo);cursor:pointer}
  .chip.on{background:var(--fumetto);border-color:var(--celeste)}
  .conf{display:flex;align-items:center;justify-content:center;gap:18px;margin-top:8px;text-align:center}
  .conf small{display:block;font-size:12px;color:var(--muto)}.conf .vs{font-size:34px;color:var(--celeste)}
  .pm{display:flex;gap:14px;align-items:flex-start;padding:12px 10px;border-radius:16px}.pm+.pm{margin-top:4px}.pm.on{background:var(--fumetto)}
  .pm .pg{flex:0 0 90px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--celeste);padding-top:3px}
  .pm b{font-weight:500}.pm small{display:block;color:var(--muto);font-size:14px}
  .steps{display:flex;gap:6px;margin-top:10px}.steps span{flex:1;height:5px;border-radius:5px;background:#ECE6F6}.steps span.on{background:var(--celeste)}
  .mini{border:1px solid #E3DCF0;background:#fff;border-radius:999px;padding:7px 14px;font:inherit;font-size:13px;color:var(--scuro);cursor:pointer;white-space:nowrap;margin-left:6px}
  .err{color:var(--no);text-align:center;font-size:14px;margin-top:8px;min-height:18px}
  textarea{width:100%;border:1px solid #E3DCF0;background:#FBFAFE;border-radius:16px;padding:12px 14px;font:inherit;color:var(--testo)}
  .top{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:10px}
  .brand{font-size:13px;letter-spacing:.3em;text-transform:uppercase;color:var(--scuro);font-weight:400;margin-right:auto}
  #roles{display:flex;gap:4px;background:#fff;border-radius:999px;padding:4px}
  #roles button{border:0;background:none;border-radius:999px;padding:7px 12px;font:inherit;font-size:12px;color:var(--muto);cursor:pointer}
  #roles button.on{background:var(--celeste);color:#fff}
  #nav{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;padding-bottom:2px}
  #nav a{white-space:nowrap;text-decoration:none;color:var(--scuro);background:#fff;border-radius:999px;padding:8px 14px;font-size:13px}
  #nav a.on{background:var(--fumetto);outline:1.5px solid var(--celeste)}
  .head{padding:16px 20px}.head .t{font-size:19px;margin-top:4px}
  .tb{width:100%;border-collapse:collapse}.tb td{padding:8px 0;border-top:1px solid #EFEAF7}.tb td+td{text-align:right;font-weight:500}
  a{color:var(--antracite)}
  @media(max-width:560px){.figs{grid-template-columns:repeat(2,1fr)}.scala button{padding:9px 0;font-size:13px}#roles button{padding:6px 9px}}
</style></head>

</div>
<script>const HERO='<svg viewBox="0 100 600 230" role="img" aria-label="Curve degli ormoni che cambiano durante il ciclo">\n      <defs>\n        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#C9BCEB"/><stop offset=".55" stop-color="#A694D9"/><stop offset="1" stop-color="#7D6BB8"/></linearGradient>\n        <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="38"/></filter>\n        <linearGradient id="est" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>\n        <linearGradient id="pro" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EBDDFB" stop-opacity=".5"/><stop offset="1" stop-color="#EBDDFB" stop-opacity="0"/></linearGradient>\n      </defs>\n      \n      <circle cx="510" cy="-60" r="140" fill="#E9E1FA" opacity=".55" filter="url(#blur)"/>\n      <circle cx="90" cy="300" r="120" fill="#6B58A8" opacity=".5" filter="url(#blur)"/>\n      <circle cx="330" cy="180" r="90" fill="#F5D9F0" opacity=".35" filter="url(#blur)"/>\n      <!-- progesterone -->\n      <path d="M0 292 C150 292 230 290 300 282 C360 274 380 205 445 200 C505 196 535 262 600 288 L600 330 L0 330Z" fill="url(#pro)"/>\n      <path d="M0 292 C150 292 230 290 300 282 C360 274 380 205 445 200 C505 196 535 262 600 288" fill="none" stroke="#F3EAFE" stroke-width="2" stroke-dasharray="2 7" stroke-linecap="round"/>\n      <!-- estrogeni -->\n      <path d="M0 286 C80 284 140 270 200 230 C240 202 262 160 285 162 C310 164 320 250 350 252 C390 254 420 222 450 222 C500 222 540 270 600 282 L600 330 L0 330Z" fill="url(#est)"/>\n      <path d="M0 286 C80 284 140 270 200 230 C240 202 262 160 285 162 C310 164 320 250 350 252 C390 254 420 222 450 222 C500 222 540 270 600 282" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/>\n      <!-- fasi -->\n      <g stroke="#fff" stroke-opacity=".35" stroke-width="1"><line x1="107" y1="150" x2="107" y2="312"/><line x1="278" y1="150" x2="278" y2="312"/><line x1="343" y1="150" x2="343" y2="312"/></g>\n      <g fill="#fff" fill-opacity=".85" font-family="Larke,Jost,sans-serif" font-size="10" letter-spacing="2.4">\n        <text x="18" y="318">MESTRUALE</text><text x="120" y="318">FOLLICOLARE</text><text x="286" y="318">OVUL.</text><text x="430" y="318">LUTEALE</text>\n      </g>\n      <circle cx="285" cy="162" r="5" fill="#fff"/><circle cx="285" cy="162" r="11" fill="none" stroke="#fff" stroke-opacity=".5"/>\n      <g font-family="Larke,Jost,sans-serif" font-size="9" letter-spacing="1.8" fill="#fff" fill-opacity=".8">\n        <text x="210" y="150">ESTROGENI</text><text x="452" y="190">PROGESTERONE</text>\n      </g>\n    </svg>';
"use strict";
/* ============================================================
   FASE – piattaforma (versione 1, dati sul dispositivo)
   Tutto l'accesso ai dati passa da DB: per collegare il database
   online basta riscrivere questo oggetto, il resto resta uguale.

const KEY="fase-piattaforma-v1";
const COMUNI=["Altidona","Amandola","Belmonte Piceno","Campofilone","Falerone","Fermo","Francavilla d'Ete","Grottazzolina","Lapedona","Magliano di Tenna","Massa Fermana","Monsampietro Morico","Montappone","Monte Giberto","Monte Rinaldo","Monte San Pietrangeli","Monte Urano","Monte Vidon Combatte","Monte Vidon Corrado","Montefalcone Appennino","Montefortino","Montegiorgio","Montegranaro","Monteleone di Fermo","Montelparo","Monterubbiano","Montottone","Moresco","Ortezzano","Pedaso","Petritoli","Ponzano di Fermo","Porto San Giorgio","Porto Sant'Elpidio","Rapagnano","Santa Vittoria in Matenano","Sant'Elpidio a Mare","Servigliano","Smerillo","Torre San Patrizio"];

const SEED={
  v:1,
  regole:{versione:1,data:"2026-11-21",gonf:5,dolMid:5,dolStop:8},
  donne:[], test:[], schede:[], richieste:[], valutazioni:[], valori:[],
  pro:[
    {id:"p1",nome:"Skinem Casabianca",tipo:"estetista",comune:"Fermo",indirizzo:"Lido di Fermo",descr:"Centro Skinem: percorsi corpo con il metodo Fase.",orari:"Lun–Sab 9–19",tel:"",email:"",tratt:["P","RC","SL","SC","RM","TM","TP"],stato:"attivo",quota:true,demo:false},
    {id:"p2",nome:"Studio nutrizione (esempio)",tipo:"nutrizionista",comune:"Porto San Giorgio",indirizzo:"",descr:"Profilo di esempio per la prova.",orari:"",tel:"",email:"",tratt:[],stato:"attivo",quota:true,demo:true},
    {id:"p3",nome:"Ginecologia (esempio)",tipo:"ginecologo",comune:"Fermo",indirizzo:"",descr:"Profilo di esempio per la prova.",orari:"",tel:"",email:"",tratt:[],stato:"attivo",quota:true,demo:true},
    {id:"p4",nome:"Personal trainer (esempio)",tipo:"trainer",comune:"Porto Sant'Elpidio",indirizzo:"",descr:"Profilo di esempio per la prova.",orari:"",tel:"",email:"",tratt:[],stato:"attivo",quota:true,demo:true},
    {id:"p5",nome:"Centro estetico (esempio)",tipo:"estetista",comune:"Sant'Elpidio a Mare",indirizzo:"",descr:"Profilo di esempio per la prova.",orari:"",tel:"",email:"",tratt:["P","RC","SL","TM"],stato:"attivo",quota:false,demo:true}
  ],

  sessione:{donna:null,pro:"p1",centro:null,operatrice:null}
};
let mem=null;
const DB={
  load(){ if(mem) return mem; try{ const t=localStorage.getItem(KEY); mem=t?JSON.parse(t):null; }catch(e){} if(!mem) mem=JSON.parse(JSON.stringify(SEED)); return mem; },
  save(){ try{ localStorage.setItem(KEY,JSON.stringify(mem)); }catch(e){} },
  reset(){ mem=JSON.parse(JSON.stringify(SEED)); DB.save(); }
};
const S=()=>{const d=DB.load(); if(!d.valori) d.valori=[]; return d;};
const uid=p=>p+Math.random().toString(36).slice(2,9);
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const MESI=["gen","feb","mar","apr","mag","giu","lug","ago","set","ott","nov","dic"];

const SITU={ciclo:"Naturale e regolare",irregolare:"Irregolare / non lo so",pillola:"Pillola o simili",peri:"Perimenopausa",meno:"Menopausa",allattamento:"Allatto",gravidanza:"Sono incinta"};
const ZONE={addome:"Tonificare l'addome",fianchi:"Modellare i fianchi",glutei:"Tonificare i glutei",interno:"Rassodare l'interno coscia",esterno:"Tonificare l'esterno coscia",braccia:"Rassodare le braccia"};

const FRASE_BIL="In certi giorni del mese peso e gonfiore cambiano anche quando il percorso sta funzionando, e non dicono nulla sul grasso. Per questo il risultato si misura sempre nelle stesse condizioni e nello stesso periodo del ciclo.";

 {g:"Composizione corporea (bioimpedenza)",fonte:"Biologo o nutrizionista",v:[["peso","Peso","kg"],["mg_pct","Massa grassa","%"],["mm","Massa magra","kg"],["mmusc","Massa muscolare","kg"],["acqua_tot","Acqua totale","%"],["aic","Acqua intracellulare","L"],["aec","Acqua extracellulare","L"],["mb","Metabolismo basale","kcal"],["pa","Angolo di fase","°"]]},
 {g:"Circonferenze",fonte:"Professionista o centro",v:[["vita","Vita","cm"],["fianchi","Fianchi","cm"],["coscia","Coscia","cm"],["braccio","Braccio","cm"]]},
 {g:"Analisi del sangue",fonte:"Laboratorio",v:[["col","Colesterolo totale","mg/dl"],["hdl","Colesterolo HDL","mg/dl"],["ldl","Colesterolo LDL","mg/dl"],["trig","Trigliceridi","mg/dl"],["gli","Glicemia a digiuno","mg/dl"],["ins","Insulina","µU/ml"],["tsh","TSH","µUI/ml"],["ft4","FT4","ng/dl"],["ferr","Ferritina","ng/ml"],["vitd","Vitamina D","ng/ml"]]},
 {g:"Ormoni",fonte:"Ginecologa",v:[["fsh","FSH","mUI/ml"],["lh","LH","mUI/ml"],["e2","Estradiolo","pg/ml"],["prog","Progesterone","ng/ml"],["prl","Prolattina","ng/ml"],["testo","Testosterone","ng/ml"],["amh","AMH","ng/ml"]]}
];

const fmtN=x=>String(Math.round(x*100)/100).replace(".",",");
function storicoValori(donnaId){const L=S().valori.filter(x=>x.donna===donnaId).sort((a,b)=>a.data<b.data?-1:1); const out={};
 L.forEach(r=>Object.entries(r.v).forEach(([k,val])=>{(out[k]=out[k]||[]).push({data:r.data,val,fonte:r.fonte});})); return out;}
function htmlValori(donnaId,full){const st=storicoValori(donnaId); const keys=Object.keys(st); if(!keys.length) return `<p class="hint" style="margin:0">Nessun valore inserito.</p>`;
 return VAL.map(g=>{const ks=g.v.filter(([k])=>st[k]); if(!ks.length) return ""; return `<div class="lab" style="margin-top:12px">${g.g}</div><table class="tb">${ks.map(([k,n,u])=>{const a=st[k], l=a[a.length-1], p=a.length>1?a[a.length-2]:null; const d=p?l.val-p.val:null;
  return `<tr><td>${n}<br><small style="color:var(--muto)">${fdd(l.data)} · ${esc(l.fonte)}</small></td><td>${fmtN(l.val)} ${u}${d!=null&&d!==0?`<br><small style="color:var(--muto)">${d>0?"+":""}${fmtN(d)} dal ${fdd(p.data)}</small>`:""}</td></tr>`+(full&&a.length>2?`<tr><td colspan="2"><small style="color:var(--muto)">Storico: ${a.map(x=>fmtN(x.val)+" ("+fdd(x.data)+")").join(" · ")}</small></td></tr>`:"");}).join("")}</table>`;}).join("");}
function avvisiValori(donnaId){const st=storicoValori(donnaId); const last=k=>st[k]?st[k][st[k].length-1].val:null; const f=[];
 if(last("col")>200)f.push("colesterolo totale"); if(last("trig")>150)f.push("trigliceridi"); const g=last("gli"); if(g!=null&&(g<70||g>100))f.push("glicemia"); const t=last("tsh"); if(t!=null&&(t<0.4||t>4))f.push("TSH");
 return f;}
function trList(keys,breve){return [...new Set(keys)].sort((a,b)=>ORD.indexOf(a)-ORD.indexOf(b)).map(k=>({k,n:TR[k].n+(k==="SL"&&breve?" (breve)":""),d:TR[k].d}));}

/* i = {situ,last,len,obi,zone[],fig,gonf,dol,sym[],sede[],sal{}, eta, cabina:{temps[],esami{},anam}}  rif = data di riferimento */
function motore(i,rif){
  const R=S().regole, oggi=rif?new Date(rif):today(); oggi.setHours(12,0,0,0);
  const L=num(i.len)||28, situ=i.situ, sal=i.sal||{}, sym=i.sym||[], hs=k=>sym.includes(k);
  const gonf=i.gonf!=null?i.gonf:(i.fig?FIG[i.fig].gonf:0), dol=i.dol||0;
  let key=null, giorno=null, lastD=null;
  if(i.last && ["ciclo","irregolare","peri"].includes(situ)){ lastD=new Date(i.last+"T12:00:00"); giorno=Math.floor((oggi-lastD)/86400000)+1; }
  if(situ==="ciclo" && giorno>0) key = giorno>L+5?"ritardo":giorno<=5?"mestruale":giorno<=L-15?"follicolare":giorno<=L-12?"ovulatoria":"luteale";
  const stimata = !!key && key!=="ritardo";
  const tipica = stimata ? ((giorno<=5||giorno>=L-6)?"pancia":"leggera") : null;
  const ob=OBI[i.obi]||OBI.adipe;
  let esito, tr=[], aspetta=[], perche=[], allarme=false, stop=false;
  if(sal.acuto){ esito="Nessun trattamento"; allarme=true; stop=true; perche.push(["Sintomi improvvisi: va sentito subito il medico.","R3"]); }
  else if(situ==="gravidanza"||sal.incinta||sal.tumori){ esito="Solo Pausa, senza tecnologie"; tr=trList(["P"]); stop=true; perche.push(["Gravidanza, possibile gravidanza o tumore.","R4"]); }
  else if(key==="ritardo"){ esito="Solo Pausa"; tr=trList(["P"]); stop=true; perche.push(["Ciclo in ritardo: prima si chiarisce una possibile gravidanza.","R5"]); }
  else if(dol>=R.dolStop){ esito="Si rimanda"; stop=true; perche.push([`Dolore ${dol}/10.`,"R6"]); }
  else if(hs("crampi")||dol>=R.dolMid){ esito="Seduta calmante"; tr=trList(["P","RC"]); aspetta.push(["Rimodella e lavoro sull'addome","R7"]); perche.push([hs("crampi")?"Oggi ha crampi.":`Oggi riferisce dolore ${dol}/10.`,"R7"]); }
  else if(gonf>=R.gonf){ esito="Seduta circolo"; tr=trList(["RC","SL"]); aspetta.push(["Rimodella: su un tessuto gonfio non si lavora l'adipe","R16"]); perche.push([`Si sente gonfia (${gonf}/10): prima circolo, poi drenaggio.`,"R8"]); }
  else if(key==="mestruale"){ esito="Seduta calmante"; tr=trList(["P","RC"]); perche.push(["Fase mestruale: benessere e circolo con dolcezza.","R10"]); }
  else { esito="Seduta "+ob.n.toLowerCase(); tr=trList(ob.t,ob.breve);
    if(stimata) perche.push([FASI[key][0]+(key==="luteale"?", si sente bene":"")+": si lavora sull'obiettivo.",key==="luteale"?"R12":"R11"]);
    else perche.push(["Nessuna fase dal calendario: decide come si sente.",situ==="ciclo"?"R2":"R14"]); }
  // piano
  const piano=[];
  if(stimata){
    const k=Math.floor((giorno-1)/L), d0=addD(lastD,k*L);
    const w=(a,b)=>{let A=addD(d0,a-1),B=addD(d0,b-1);if(B<oggi){A=addD(A,L);B=addD(B,L);}return {A,B,txt:(A<=oggi?"da oggi":"dal "+fd(A))+" al "+fd(B),on:giorno>=a&&giorno<=b};};
    const tob=trList(ob.t,ob.breve).map(t=>t.n).join(" → ");
    piano.push({g:"1–5",nome:"Ti ascoltiamo",tr:"Pausa → Risveglio Circolo",r:"R10",w:w(1,5)});
    piano.push({g:`6–${L-12}`,nome:"Il momento di lavorare",tr:tob,r:"R11",w:w(6,L-12)});
    piano.push({g:`${L-11}–${L-7}`,nome:"Continuiamo",tr:tob+" (se si sente bene)",r:"R12",w:w(L-11,L-7)});
    piano.push({g:`${L-6}–${L}`,nome:"Ci regoliamo su di te",tr:"Se gonfia: Risveglio Circolo → Sblocco Linfatico; altrimenti obiettivo",r:"R13",w:w(L-6,L)});
    piano.sort((a,b)=>a.w.A-b.w.A);
  }
  // fase/incertezza
  let inc=null, notaTemp=null;
  if(stimata){ inc="media — solo calendario"; if(L!==28||(giorno>=L-17&&giorno<=L-9)) inc="alta — vicino all'ovulazione o ciclo non di 28 giorni";
    const temps=(i.cabina&&i.cabina.temps)||[];
    if(temps.length>=6){const m=a=>a.reduce((x,y)=>x+y,0)/a.length;const diff=m(temps.slice(-3))-m(temps.slice(0,3));const rial=diff>=0.2;
      notaTemp=rial?`rialzo di circa ${diff.toFixed(1).replace(".",",")} °C: ovulazione probabilmente avvenuta.`:"nessun rialzo sostenuto.";
      const ok=(rial&&key==="luteale")||(!rial&&["mestruale","follicolare"].includes(key)); inc=ok?"più bassa — calendario e temperatura d'accordo":"alta — calendario e temperatura non tornano"; } }
  // bilancia (cabina)
  const bil=[]; let bilOk;
  if(stimata){ const fuori=key==="mestruale"||giorno>=L-6; bilOk=!fuori&&gonf<R.gonf;
    const k=Math.floor((giorno-1)/L); let w0=addD(lastD,k*L+5),w1=addD(lastD,k*L+12); const from=bilOk?oggi:addD(oggi,1); if(w1<from){w0=addD(w0,L);w1=addD(w1,L);} if(w0<from)w0=from;
    bil.push([fuori?"Oggi non pesarla (giorni del ciclo o ultimi 7 giorni): se insiste, scrivi il peso ma non confrontarlo.":gonf>=R.gonf?"Oggi si sente gonfia: peso e misure non valgono come confronto.":"Oggi puoi pesarla: a digiuno, stessa ora.",fuori?"R20":gonf>=R.gonf?"R18":"R21"]);
    bil.push([`Prossima pesata utile: tra il ${fd(w0)} e il ${fd(w1)}.`,"R21"]);
    bil.push([`Misure con il metro: intorno al ${fd(addD(lastD,(Math.floor((giorno-1)/L)+1)*L+((giorno-1)%L)))}, stesso giorno del prossimo ciclo.`,"R17"]);
  } else { bilOk=gonf<R.gonf; bil.push([bilOk?"Puoi pesarla: stesse condizioni delle altre volte.":"Oggi si sente gonfia: peso e misure non valgono come confronto.",bilOk?"R21":"R18"]); bil.push(["Peso e misure ogni 4 settimane.","R17"]); }
  bil.push(["Peso, gonfiore e centimetri non misurano il grasso: si guarda l'andamento.","R22"]);
  // medico
  const med=[]; const es=(i.cabina&&i.cabina.esami)||{};
  const fuoriEs=[]; if(es.col>200)fuoriEs.push("colesterolo"); if(es.trig>150)fuoriEs.push("trigliceridi"); if(es.gli!=null&&(es.gli<70||es.gli>100))fuoriEs.push("glicemia"); if(es.tsh!=null&&(es.tsh<0.4||es.tsh>4))fuoriEs.push("TSH");
  if(sal.acuto) med.push("Sintomi improvvisi: subito dal medico, o il 112 se peggiorano.");
  if(fuoriEs.length) med.push("Esami fuori dai riferimenti ("+fuoriEs.join(", ")+"): ne parli con il medico.");
  if(situ==="irregolare") med.push("Ciclo irregolare: una visita dal ginecologo, se non l'ha già fatta.");
  if(gonf>=7&&(i.sede||[]).includes("gambe")) med.push("Gonfiore forte alle gambe: se è nuovo, non passa o è da una gamba sola, va visto dal medico.");
  if(sal.tumori) med.push("Tumori: niente tecnologie senza autorizzazione scritta dell'oncologo.");
  if(sal.cuore) med.push("Cuore o pacemaker: serve l'ok del medico.");
  if(i.eta>=43&&situ==="ciclo") med.push("Ha 43 anni o più: chiedile se il ciclo è cambiato negli ultimi mesi.");
  // attenzioni
  const att=[]; if(situ==="allattamento")att.push("Allattamento: solo con l'ok del medico, mai sul seno.");
  if(sal.vene)att.push("Varici o trombosi: drenaggio delicato, niente calore forte sulle gambe."); if(sal.pelle)att.push("Lesioni o infezioni: non lavorare su quella zona."); if(sal.farmaci)att.push("Anticoagulanti o farmaci fotosensibilizzanti: niente stimoli forti, rischio lividi."); if(sal.tiroide)att.push("Tiroide: non lavorare sul collo."); if(sal.metalli)att.push("Protesi metalliche: non lavorare su quella zona."); if(hs("seno"))att.push("Seno teso: evita la zona."); if(hs("vampate"))att.push("Vampate: poco calore."); if(hs("sensibile"))att.push("Pelle sensibile: intensità bassa.");
  const zone=(i.zone||[]).map(z=>({z:ZONEN[z],o:ZONE[z]}));
  return {key,giorno,L,stimata,tipica,esito,tr,aspetta,perche,allarme,stop,piano,inc,notaTemp,bil,bilOk,med,att,zone,gonf,dol,fuoriEs,versione:R.versione};
}

let gid=0;
function svgFig(k,w){const id="hg"+(++gid);const h=(x,y,rx,ry,o)=>`<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" fill="url(#${id})" opacity="${o||1}"/>`;
  const X={leggera:"",pancia:h(60,140,26,22)+`<path d="M50,150 l4,-4 l4,4 l4,-4 l4,4 l4,-4" fill="none" stroke="#8E7CC6" stroke-width="1.4"/>`,pesante:h(44,245,13,34)+h(76,245,13,34),gonfia:h(60,138,28,24)+h(44,245,13,34)+h(76,245,13,34)+h(50,84,10,8,.9)+h(70,84,10,8,.9)}[k];
  return `<svg viewBox="0 0 120 300" ${w?`style="width:${w}px"`:""}><defs><radialGradient id="${id}"><stop offset="0" stop-color="#A694D9" stop-opacity=".75"/><stop offset="1" stop-color="#A694D9" stop-opacity="0"/></radialGradient></defs>${X}<g fill="none" stroke="#5A4D86" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${BODY}</g></svg>`;}
function striscia(g,L){const seg=[["Mestruale",1,5],["Follicolare",6,L-15],["Ovulazione*",L-14,L-12],["Luteale",L-11,L]];
  return `<div class="strip">`+seg.map(([n,a,b])=>`<div class="sg${g>=a&&g<=b?" on":""}" style="flex:${b-a+1}"><span>${n}</span><small>${a}–${b}</small></div>`).join("")+`</div><div class="hint" style="font-size:12px">* Il giorno dell'ovulazione è indicativo: in ogni donna può cambiare.</div>`;}

function formCiclo(v){v=v||{};return `
  <div class="grid">
    <div><label class="f">Com'è il tuo ciclo?</label><select id="situ">${Object.entries(SITU).map(([k,n])=>`<option value="${k}"${v.situ===k?" selected":""}>${n}</option>`).join("")}</select></div>
    <div id="bLast"><label class="f">Primo giorno dell'ultimo ciclo</label><input type="date" id="last" value="${v.last||""}"></div>
    <div id="bLen"><label class="f">Di solito quanti giorni dura?</label><input type="number" id="len" min="21" max="40" value="${v.len||28}"></div>
  </div>`;}
function bindCiclo(){const f=()=>{const s=$("#situ").value;$("#bLast").classList.toggle("hide",!["ciclo","irregolare","peri"].includes(s));$("#bLen").classList.toggle("hide",s!=="ciclo");};$("#situ").onchange=f;f();}
function readCiclo(){return {situ:$("#situ").value,last:$("#last").value,len:num($("#len").value)||28};}
function formObi(v){v=v||{};return `
  <label class="f">Il tuo obiettivo</label><select id="obi">${Object.entries(OBI).map(([k,o])=>`<option value="${k}"${v.obi===k?" selected":""}>${o.n}</option>`).join("")}</select>
  <label class="f">Le zone, anche più di una</label><div class="chips" id="zone">${Object.entries(ZONEN).map(([k,n])=>`<button type="button" class="chip${(v.zone||[]).includes(k)?" on":""}" data-v="${k}">${n}</button>`).join("")}</div>`;}
function formSente(v){v=v||{};return `
  <h2>Quale ti somiglia di più?</h2><div class="hint">Tocca la figura: conta come ti senti oggi.</div>
  <div class="figs" id="figs">${Object.keys(FIG).map(k=>`<button type="button" class="fig${v.fig===k?" on":""}" data-v="${k}">${svgFig(k)}<b>${FIG[k].n}</b><small>${FIG[k].d}</small></button>`).join("")}</div>
  <label class="f" style="margin-top:18px">Dolore o fastidio, da 0 a 10</label>
  <div class="scala" id="dol">${[...Array(11).keys()].map(n=>`<button type="button" data-v="${n}" class="${v.dol===n?"on":""}">${n}</button>`).join("")}</div>
  <label class="f" style="margin-top:18px">Altro che senti</label>
  <div class="chips" id="sym">${Object.entries(SYMN).map(([k,n])=>`<button type="button" class="chip${(v.sym||[]).includes(k)?" on":""}" data-v="${k}">${n}</button>`).join("")}</div>`;}
function formSalute(v){v=v||{};return `<div class="checks">${Object.entries(SALUTE).map(([k,n])=>`<label class="ck${k==="acuto"?" full":""}"><input type="checkbox" data-s="${k}"${v[k]?" checked":""}>${n}</label>`).join("")}</div>`;}
function bindPick(){
  document.querySelectorAll("#zone .chip,#sym .chip").forEach(b=>b.onclick=()=>b.classList.toggle("on"));

}
const picked=sel=>[...document.querySelectorAll(sel+" .on")].map(b=>b.dataset.v);
const readSalute=()=>{const o={};document.querySelectorAll("input[data-s]").forEach(c=>o[c.dataset.s]=c.checked);return o;};

/* ============================ RENDER SCHEDA ============================ */
function htmlFase(r){ if(!r.key) return `<div class="fase-big">Partiamo da come ti senti</div><p style="margin:0">Il calendario non ci dice abbastanza: decide come ti senti oggi.</p>`;
  if(r.key==="ritardo") return `<div class="fase-big">Ciclo in ritardo</div><p style="margin:0">Prima di tutto va chiarita una possibile gravidanza.</p>`;
  return `<div class="fase-big">Giorno ${r.giorno} · ${FASI[r.key][0]}</div><p style="margin:0">${FASI[r.key][2]}</p>${striscia(r.giorno,r.L)}`;}
function htmlConfronto(r,fig){ if(!r.tipica||!fig) return ""; const ok=r.tipica===fig;
  return `<div class="card"><div class="lab">Come ti senti e la tua fase</div><div class="conf"><div>${svgFig(fig,70)}<small>Come ti senti</small></div><div class="vs">${ok?"=":"≠"}</div><div>${svgFig(r.tipica,70)}<small>Tipico di questi giorni</small></div></div><p style="text-align:center;margin:10px 0 0">${ok?"<b>Quello che senti è in linea con la tua fase.</b>":"<b>Oggi ti senti diversa da ciò che è tipico.</b> Va benissimo: partiamo da come ti senti tu."}</p></div>`;}
function htmlTr(r,regole){ return r.tr.map((t,i)=>`<div class="az"><span class="n">${i+1}</span><div><b>${t.n}</b><small>${t.d}</small></div></div>`).join("")+(r.aspetta.length?`<div class="asp">${r.aspetta.map(([t,x])=>`Aspetta: <b>${t}</b>${regole?" "+rr(x):""}`).join("<br>")}</div>`:""); }
function htmlPiano(r,regole){ if(!r.piano.length) return ""; return `<div class="card"><div class="lab">Il tuo mese</div>${r.piano.map(p=>`<div class="pm${p.w.on?" on":""}"><div class="pg">Giorni ${p.g}</div><div><b>${p.nome}</b>${regole?" "+rr(p.r):""}<small>${p.tr} · ${p.w.txt}</small></div></div>`).join("")}</div>`; }

function schedaDonna(sc){ const r=sc.r, t=sc.input;
  let h=`<div class="card"><div class="lab">La tua scheda · ${fdd(sc.data)}</div>${htmlFase(r)}</div>`;
  if(r.allarme) return h+`<div class="card" style="background:#fde9e6"><div class="lab" style="color:#9b3129">Senti il medico</div><p style="margin:6px 0 0"><b>Hai indicato sintomi che vanno visti subito da un medico.</b> Oggi non ti proponiamo trattamenti. Se peggiorano, chiama il 112.</p></div>`;
  h+=htmlConfronto(r,t.fig);
  h+=`<div class="card oggi"><div class="lab">I trattamenti adatti a te oggi</div><div class="fase-big" style="font-size:18px">${r.esito}</div>${htmlTr(r,false)}</div>`;
  h+=htmlPiano(r,false);
  if(r.zone.length) h+=`<div class="card"><div class="lab">Per il tono</div>${li(r.zone.map(z=>`<b>${z.z}:</b> ${z.o.toLowerCase()}`))}<p class="hint">Rivolgiti a un <b>personal trainer</b> per il tono e a un <b>nutrizionista</b> per l'alimentazione: il come lo decidono loro.</p></div>`;
  else h+=`<div class="card"><div class="lab">Gli altri professionisti</div><p class="hint" style="margin:0">Per un risultato completo: un <b>nutrizionista</b> per l'alimentazione e un <b>personal trainer</b> per il tono.</p></div>`;
  h+=`<div class="card"><div class="lab">La bilancia</div><p style="margin:4px 0 0">${FRASE_BIL}</p></div>`;
  const si=Object.keys(t.sal||{}).filter(k=>t.sal[k]);
  if(si.length) h+=`<div class="card"><div class="lab">Da dire al professionista</div>${li(si.map(k=>SALUTE[k]))}</div>`;
  if(r.med.length) h+=`<div class="card"><div class="lab">Ne parli con il medico</div>${li(r.med)}</div>`;
  return h;}

function riepilogo(v){const sal=Object.keys(v.sal||{}).filter(k=>v.sal[k]);

 return row("Ciclo",SITU[v.situ]+(v.last?" · ultimo ciclo "+v.last:""),1)+row("Obiettivo",OBI[v.obi].n+(v.zone.length?" · "+v.zone.map(z=>ZONEN[z]).join(", "):""),2)+row("Come ti senti",FIG[v.fig].n+" · dolore "+v.dol+"/10"+(v.sym.length?" · "+v.sym.map(s=>SYMN[s]).join(", "):""),3)+row("Salute",sal.length?sal.map(k=>SALUTE[k]).join("; "):"Nessuna voce",4);}
window.avanti=()=>{const st=tmp.step||1, v=tmp.test=tmp.test||{}; const err=$("#err");

 if(st===2){v.obi=$("#obi").value;v.zone=picked("#zone");}
 if(st===3){const f=picked("#figs")[0],d=picked("#dol")[0]; if(!f||d==null){err.textContent="Scegli la figura e un numero per il dolore.";return;} v.fig=f;v.dol=+d;v.sym=picked("#sym");v.gonf=FIG[f].gonf;v.sede=FIG[f].sede;}
 if(st===4){v.sal=readSalute();}
 if(st===5){ const s=S(); const t={id:uid("t"),donna:s.sessione.donna,data:new Date().toISOString(),input:JSON.parse(JSON.stringify(v))};
   s.test.push(t); const r=motore(v); const sc={id:uid("s"),donna:t.donna,test:t.id,data:t.data,input:t.input,r,versione:r.versione}; s.schede.push(sc); DB.save(); tmp={}; location.hash="#d4/"+sc.id; return;}
 tmp.step=st+1; render();};
